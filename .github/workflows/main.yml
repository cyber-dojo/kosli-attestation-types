name: Main

on:
  push:

env:
  KOSLI_DRY_RUN: ${{ vars.KOSLI_DRY_RUN }}           # false
  KOSLI_HOST: ${{ vars.KOSLI_HOST }}                 # https://app.kosli.com
  KOSLI_ORG: ${{ vars.KOSLI_ORG }}                   # cyber-dojo
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}

jobs:

  # Gate on this repo's own rego policy tests. create-kosli-attestation-types
  # needs this, so a broken policy fails before any type is created. The tests
  # need jq (preinstalled) and the kosli CLI; they call `kosli evaluate input`,
  # which makes no API calls, so no token is required.
  test-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      - name: Run rego policy tests
        run: make test

  create-kosli-attestation-types:
    needs: test-policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Kosli CLI
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      - name: Create test metrics attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type test-metrics
            --schema=metrics-test.schema.json
            --jq ".test_count >= 1"
            --jq ".failure_count == 0"
            --jq ".error_count == 0"
            --jq ".skip_count == 0"

      - name: Create coverage metrics attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type coverage-metrics
            --schema=metrics-coverage.schema.json
            --jq ".test.lines.total >= 1"
            --jq ".test.lines.missed == 0"
            --jq ".test.branches.total <= 20"
            --jq ".test.branches.missed == 0"
            --jq ".code.branches.total <= 250"

      - name: Create artifact promotion attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type promotion

      - name: Create kosli-evaluate-trails attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type kosli-evaluate-trails
            --schema=kosli-evaluate-trails-schema.json

      # Schema only, no --jq: the SBOM facts attestation is a neutral data carrier;
      # compliance is decided by the SDLC-CTRL-0004 rego, not by this type.
      - name: Create sbom facts attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type sbom-facts
            --schema=sbom-facts.schema.json

      # Schema only, no --jq: the provenance facts attestation is a neutral data
      # carrier; compliance is decided by the SDLC-CTRL-0002 rego, not by this type.
      - name: Create provenance facts attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type provenance-facts
            --schema=provenance-facts.schema.json

      # Schema only, no --jq, for the same reason as coverage-facts. The
      # test-metrics type above decides compliance in its own --jq rules.
      - name: Create test facts attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type test-facts
            --schema=test-facts.schema.json

      # Schema only, no --jq: the coverage facts attestation is a neutral data
      # carrier; compliance is decided by metrics-compliance.rego against the
      # bounds each repo supplies. The coverage-metrics type above takes the
      # other approach, deciding compliance in its own --jq rules, which fixes
      # one set of numbers for every repo attesting to it. Both types exist,
      # and repos using coverage-metrics keep working unchanged.
      - name: Create coverage facts attestation type
        if: ${{ github.ref == 'refs/heads/main' }}
        run:
          kosli create attestation-type coverage-facts
            --schema=coverage-facts.schema.json
